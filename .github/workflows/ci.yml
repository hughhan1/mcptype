name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.changes.outputs.native == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            native:
              - '.github/**'
              - '.cargo/**'
              - '.dockerignore'
              - 'packaging/**'
              - 'bindings/**'
              - 'scripts/**'
              - 'Cargo*'
              - 'rust-toolchain*'
              - 'package*.json'
              - 'pyproject.toml'
              - 'build.rs'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  contracts:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.quality.outputs.full == 'true' && '["ubuntu-24.04","ubuntu-24.04-arm","macos-15","macos-15-intel"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo test --locked
      - run: cargo build --locked --release --bin mcptype
      - run: npm ci
      - run: npm test
      - run: uv build --wheel --out-dir dist
      - run: uv venv
      - run: for wheel in dist/*.whl; do uv pip install "${wheel}[test]"; done
      - run: uv run --no-project pytest
      - if: matrix.runner == 'ubuntu-24.04'
        run: uv run --no-project mypy --strict python/mcptype
