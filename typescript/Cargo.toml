[package]
name = "mcptype-node"
version = "0.0.5"
edition = "2024"

[lib]
path = "lib.rs"
crate-type = ["cdylib"]
test = false

[dependencies]
mcptype = { path = "..", default-features = false }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
